<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="#{users.new}">Nouvel utilisateur</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-3" th:text="#{users.new}">Nouvel utilisateur</h1>

    <div class="col-lg-6">
        <form th:action="@{/users}" th:object="${userForm}" method="post" class="card card-body">
            <div class="mb-3">
                <label class="form-label" th:text="#{users.username}">Identifiant</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="p.ex. nirina.rakoto">
                <span class="text-danger small" th:errors="*{username}"></span>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{users.fullName}">Nom complet</label>
                <input type="text" class="form-control" th:field="*{fullName}">
                <span class="text-danger small" th:errors="*{fullName}"></span>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{users.role}">Rôle</label>
                <select class="form-select" th:field="*{role}">
                    <option th:each="r : ${roles}" th:value="${r.name()}"
                            th:text="${#messages.msg('user.role.' + r.name())}"></option>
                </select>
                <span class="text-danger small" th:errors="*{role}"></span>
            </div>
            <div class="mb-3">
                <label class="form-label" th:text="#{users.password}">Mot de passe</label>
                <input type="password" class="form-control" th:field="*{password}">
                <span class="text-danger small" th:errors="*{password}"></span>
            </div>
            <div class="d-flex justify-content-end">
                <a class="btn btn-outline-secondary me-2" th:href="@{/users}" th:text="#{members.cancel}">Annuler</a>
                <button type="submit" class="btn btn-primary" th:text="#{members.save}">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
