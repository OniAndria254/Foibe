<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="#{users.resetPassword}">Mot de passe</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-3" th:text="#{users.resetPassword}">Réinitialiser le mot de passe</h1>

    <div class="col-lg-6">
        <div class="card mb-3">
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-4" th:text="#{users.username}">Identifiant</dt>
                    <dd class="col-sm-8" th:text="${target.username}"></dd>
                    <dt class="col-sm-4" th:text="#{users.fullName}">Nom complet</dt>
                    <dd class="col-sm-8" th:text="${target.fullName}"></dd>
                </dl>
            </div>
        </div>
        <form th:action="@{/users/{id}/password(id=${target.id})}" th:object="${passwordForm}" method="post" class="card card-body">
            <div class="mb-3">
                <label class="form-label" th:text="#{users.password}">Mot de passe</label>
                <input type="password" class="form-control" th:field="*{password}">
                <span class="text-danger small" th:errors="*{password}"></span>
            </div>
            <div class="d-flex justify-content-end">
                <a class="btn btn-outline-secondary me-2" th:href="@{/users}" th:text="#{members.cancel}">Annuler</a>
                <button type="submit" class="btn btn-primary" th:text="#{users.resetPassword}">Réinitialiser</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
