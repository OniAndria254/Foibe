<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.500.title}">Erreur</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
</head>
<body>
<div class="container py-5 text-center">
    <div class="display-1 text-muted" th:text="${status} ?: 500">500</div>
    <h1 class="h4" th:text="#{error.500.title}">Erreur interne</h1>
    <p class="text-muted" th:text="#{error.500.message}">Une erreur inattendue est survenue.</p>
    <a class="btn btn-primary" th:href="@{/members}" th:text="#{error.back}">Retour</a>
</div>
</body>
</html>
