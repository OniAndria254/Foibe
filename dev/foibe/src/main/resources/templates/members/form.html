<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="#{members.form.title}">Membre</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-3" th:text="${editing} ? #{members.form.edit} : #{members.form.new}">Membre</h1>

    <div class="row">
        <div class="col-lg-8">
            <form th:action="${action}" th:object="${form}" method="post" class="card card-body">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label" th:text="#{member.envelopeNumber}">N° enveloppe</label>
                        <input type="number" class="form-control" th:if="${editing}" th:field="*{envelopeNumber}"
                               th:placeholder="#{members.form.auto}" th:readonly="true">
                        <input type="text" class="form-control" th:unless="${editing}" disabled
                               th:value="#{members.form.auto}">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" th:text="#{member.lastName}">Nom</label>
                        <input type="text" class="form-control" th:field="*{lastName}">
                        <span class="text-danger small" th:errors="*{lastName}"></span>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" th:text="#{member.firstName}">Prénom</label>
                        <input type="text" class="form-control" th:field="*{firstName}">
                        <span class="text-danger small" th:errors="*{firstName}"></span>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label" th:text="#{member.sex}">Sexe</label>
                        <select class="form-select" th:field="*{sex}">
                            <option value="" th:text="#{members.form.unspecified}">Non précisé</option>
                            <option th:each="s : ${sexes}" th:value="${s.name()}"
                                    th:text="${#messages.msg('member.sex.' + s.name())}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" th:text="#{member.birthDate}">Né(e) le</label>
                        <input type="date" class="form-control" th:field="*{birthDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" th:text="#{member.status}">Statut</label>
                        <select class="form-select" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s.name()}"
                                    th:text="${#messages.msg('member.status.' + s.name())}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" th:text="#{member.joinedOn}">Date d'inscription</label>
                        <input type="date" class="form-control" th:field="*{joinedOn}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" th:text="#{member.phone}">Téléphone</label>
                        <input type="text" class="form-control" th:field="*{phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{member.address}">Adresse</label>
                        <input type="text" class="form-control" th:field="*{address}">
                    </div>

                    <div class="col-12">
                        <label class="form-label" th:text="#{member.notes}">Notes</label>
                        <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                    </div>
                </div>

                <div class="mt-3 d-flex justify-content-end">
                    <a class="btn btn-outline-secondary me-2" th:href="@{/members}" th:text="#{members.cancel}">Annuler</a>
                    <button type="submit" class="btn btn-primary" th:text="#{members.save}">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
