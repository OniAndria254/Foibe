<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${title}">Erreur</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center py-5">
            <div class="display-1 text-muted" th:text="${status}">500</div>
            <h1 class="h4" th:text="${title}">Erreur</h1>
            <p class="text-muted" th:text="${message}"></p>
            <a class="btn btn-primary mt-3" th:href="@{${backUrl}}" th:text="#{error.back}">Retour</a>
        </div>
    </div>
</div>
</body>
</html>
